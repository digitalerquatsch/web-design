<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Abmelden</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #16191f; }
  main { max-width: 460px; margin: 14vh auto 0; padding: 32px 24px; background: #fff; border: 1px solid #e2e5ea; border-radius: 14px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #4b5563; line-height: 1.55; }
  button { border: 0; background: #16191f; color: #fff; border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  @media (max-width: 520px) { main { margin: 6vh 16px 0; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Keine weiteren Nachrichten</h1>
  <p id="text">Mit einem Klick tragen wir Ihre Adresse aus. Sie erhalten dann keine weiteren E-Mails von uns.</p>
  <button type="button" id="btn">Abmelden</button>
</main>
<script>
(function () {
  var token = (location.pathname.match(/\/abmelden\/([\w-]+)/) || [])[1];
  var btn = document.getElementById("btn"), title = document.getElementById("title"), text = document.getElementById("text");
  if (!token) { text.textContent = "Dieser Link ist unvollständig."; btn.hidden = true; return; }
  btn.addEventListener("click", function () {
    btn.disabled = true;
    fetch("/api/public/unsubscribe/" + encodeURIComponent(token), { method: "POST" }).then(function (r) {
      if (!r.ok) throw new Error();
      title.textContent = "Sie sind abgemeldet";
      text.textContent = "Wir schreiben Ihnen nicht mehr. Entschuldigen Sie die Störung.";
      btn.hidden = true;
    }).catch(function () {
      text.textContent = "Das hat nicht geklappt. Antworten Sie einfach auf unsere E-Mail mit „Abmelden“, dann tragen wir Sie von Hand aus.";
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
