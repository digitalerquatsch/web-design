<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agentenwerk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="appRoot" class="shell" hidden>
  <aside class="sidenav" id="sidenav" aria-label="Hauptmenü">
    <div class="sidenav-head">
      <div class="brand"><div class="brand-mark" aria-hidden="true">A</div><span class="brand-name">Agenten<b>werk</b></span></div>
      <button type="button" class="icon-btn nav-close" id="navClose" aria-label="Menü schließen"></button>
    </div>
    <nav class="navlist" id="navList"></nav>
    <div class="sidenav-foot" id="navFoot"></div>
  </aside>
  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <div class="main">
    <header class="top">
      <button type="button" class="icon-btn nav-open" id="navOpen" aria-label="Menü öffnen" aria-controls="sidenav" aria-expanded="false"></button>
      <h1 class="page-title" id="pageTitle">Start</h1>
      <div class="agent-switch" id="agentSwitch">
        <label for="agentSelect" class="hint">Agent</label>
        <select id="agentSelect"></select>
        <button class="btn" id="newBtn" type="button">+ Neuer Agent</button>
        <span class="save-state" id="saveState" data-s="example">Neu</span>
      </div>
      <button type="button" class="usage-chip" id="usageChip" hidden></button>
      <div class="me" id="meBox"></div>
      <button type="button" class="icon-btn" id="logoutTop" aria-label="Abmelden" title="Abmelden"></button>
    </header>
    <div class="support-bar" id="supportBar" role="status" hidden></div>
    <div class="banner" id="banner" hidden></div>

    <section class="page" id="homeView" hidden></section>
    <section class="page" id="agentsView" hidden></section>
    <section class="autopilot page" id="autopilotView" hidden></section>
    <section class="acquisition page" id="acquisitionView" hidden></section>
    <section class="acquisition page" id="usersView" hidden></section>
    <section class="page review" id="reviewView" hidden></section>
    <section class="page" id="customersView" hidden></section>
    <section class="page" id="websiteView" hidden></section>
    <section class="page" id="jarvisView" hidden></section>
    <section class="page" id="systemView" hidden></section>
    <section class="page" id="accountView" hidden></section>
    <section class="page" id="mentoringView" hidden></section>

  <main class="bench" id="bench" data-mview="build">
    <div class="mobile-tabs" role="tablist">
      <button type="button" role="tab" id="mBuild" aria-selected="true">Konfigurieren</button>
      <button type="button" role="tab" id="mTest" aria-selected="false">Testen</button>
    </div>
    <nav class="rail" id="rail" aria-label="Bereiche"></nav>
    <div class="form-wrap"><section class="panel form" id="form"></section></div>
    <aside class="side">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tChat" aria-selected="true">Testchat</button>
        <button type="button" role="tab" id="tCap" aria-selected="false">Erfasst<span class="count" id="capCount">0</span></button>
      </div>
      <div id="chatView">
        <div class="widget" id="widget">
          <div class="w-head">
            <div class="w-av" id="wAv">A</div>
            <div class="w-title"><strong id="wName">Agent</strong><span>Online</span></div>
            <button class="x" type="button" id="resetChat" title="Unterhaltung neu starten">Neu starten</button>
          </div>
          <div class="w-body" id="wBody" aria-live="polite"></div>
          <div class="w-quick" id="wQuick"></div>
          <form class="w-input" id="wForm">
            <input id="wInput" type="text" autocomplete="off" maxlength="2000" placeholder="Nachricht schreiben …" aria-label="Nachricht an den Agenten">
            <button type="submit" id="wSend">Senden</button>
          </form>
          <div class="w-foot" id="wFoot">Testmodus</div>
        </div>
        <p class="side-note">Der Testchat nutzt immer den aktuellen Stand links, auch ungespeicherte Änderungen. Erfasste Testdaten sind als „Test“ markiert.</p>
      </div>
      <div id="capView" class="panel captured" hidden></div>
    </aside>
  </main>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
